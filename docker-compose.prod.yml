version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stonks_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://stonks:${DB_PASSWORD}@db:5432/stonks
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: stonks_frontend
    restart: always
    expose:
      - "80"

  db:
    image: postgres:15-alpine
    container_name: stonks_db
    restart: always
    environment:
      - POSTGRES_USER=stonks
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=stonks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonks"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stonks_redis
    restart: always
    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stonks_celery_worker
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://stonks:${DB_PASSWORD}@db:5432/stonks
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stonks_celery_beat
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://stonks:${DB_PASSWORD}@db:5432/stonks
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info

  nginx:
    image: nginx:alpine
    container_name: stonks_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    container_name: stonks_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
